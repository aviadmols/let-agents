<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #fff; --fg: #1b1b1f; --muted: #6b6b76; --line: #e7e7ec; --soft: #f5f5f8; --accent: #111; --accent-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1e1e22; --fg: #f2f2f5; --muted: #a3a3ad; --line: #34343b; --soft: #26262b; --accent: #f2f2f5; --accent-fg: #111; } }
  :root[data-theme="dark"] { --bg: #1e1e22; --fg: #f2f2f5; --muted: #a3a3ad; --line: #34343b; --soft: #26262b; --accent: #f2f2f5; --accent-fg: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--fg); background: transparent; }
  .row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
  .card { flex: 0 0 178px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  .pic { aspect-ratio: 1; background: var(--soft); display: block; width: 100%; object-fit: contain; }
  .body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .title { font-weight: 600; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
  .price { font-weight: 700; }
  .was { color: var(--muted); text-decoration: line-through; font-weight: 400; margin-inline-start: 6px; font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  button { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; border-radius: 10px; padding: 8px 10px; font-weight: 600; font-size: 13px; }
  .buy { margin-top: auto; background: var(--accent); color: var(--accent-fg); }
  .page { color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px; }
  .order { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
  .order .buy { padding: 12px; font-size: 15px; }
  .order ul { margin: 0; padding-inline-start: 18px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root" dir="auto"></div>
<script>
(function () {
  var root = document.getElementById('root');
  var data = null;
  var meta = {};
  var asked = 0;

  function label(key, fallback) {
    return (meta.labels && meta.labels[key]) || fallback;
  }

  function money(amount, currency) {
    if (amount === null || amount === undefined || amount === '') {
      return '';
    }
    var n = Number(amount);
    var text = n % 1 === 0 ? String(n) : n.toFixed(2);
    return (!currency || currency === 'ILS' ? '₪' : currency + ' ') + text;
  }

  // The store's own address, opened by the AI's host (never inside the cards).
  function open(href) {
    if (!href) {
      return;
    }
    if (window.openai && typeof window.openai.openExternal === 'function') {
      window.openai.openExternal({ href: href });
      return;
    }
    if (window.parent && window.parent !== window) {
      asked += 1;
      window.parent.postMessage({ jsonrpc: '2.0', id: 'open-' + asked, method: 'ui/open-link', params: { url: href } }, '*');
      return;
    }
    window.open(href, '_blank', 'noopener');
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) {
      node.className = cls;
    }
    if (text !== undefined && text !== null) {
      node.textContent = String(text);
    }
    return node;
  }

  function button(cls, text, href) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.addEventListener('click', function () { open(href); });
    return b;
  }

  function card(p) {
    var box = el('div', 'card');
    if (p.image) {
      var img = el('img', 'pic');
      img.src = p.image;
      img.alt = p.title || '';
      img.loading = 'lazy';
      box.appendChild(img);
    }
    var body = el('div', 'body');
    body.appendChild(el('div', 'title', p.title || ''));
    var price = el('div', 'price', money(p.price, p.currency));
    if (p.regular_price) {
      price.appendChild(el('span', 'was', money(p.regular_price, p.currency)));
    }
    body.appendChild(price);
    if (!p.in_stock) {
      body.appendChild(el('div', 'muted', label('out_of_stock', 'Out of stock')));
    } else if (p.variants && p.variants.length) {
      body.appendChild(el('div', 'muted', label('options', 'Options') + ': ' + p.variants.length));
    }
    if (p.buy_url && p.in_stock) {
      body.appendChild(button('buy', label('buy', 'Buy'), p.buy_url));
    } else if (p.url) {
      body.appendChild(button('buy', label('choose', 'Choose on the store'), p.url));
    }
    if (p.url && p.buy_url) {
      body.appendChild(button('page', label('page', 'Product page'), p.url));
    }
    box.appendChild(body);
    return box;
  }

  function order(cart) {
    var box = el('div', 'order');
    var count = (cart.links || []).length;
    box.appendChild(el('div', 'title', label('order_title', 'Your order') + (data.store && data.store.name ? ' · ' + data.store.name : '')));
    if (cart.problems && cart.problems.length) {
      var list = el('ul', 'muted');
      cart.problems.forEach(function (problem) {
        list.appendChild(el('li', null, (problem.title || problem.product || '') + ' — ' + label('problem_' + problem.problem, problem.problem)));
      });
      box.appendChild(list);
    }
    if (cart.url) {
      box.appendChild(button('buy', label('checkout', 'To checkout') + (count > 1 ? ' (' + count + ')' : ''), cart.url));
    }
    return box;
  }

  // A checked order (calculate_cart): its lines, what goes into the cart now, and one button that
  // opens it on the store's own site, where it goes into the cart.
  function checked(o) {
    var box = el('div', 'order');
    box.appendChild(el('div', 'title', label('order_title', 'Your order') + (data.store && data.store.name ? ' · ' + data.store.name : '')));
    var list = el('ul', 'muted');
    (o.lines || []).forEach(function (l) {
      var what = (l.title || l.product || '') + (l.option ? ' · ' + l.option.title : '') + (l.length ? ' · ' + l.length.label : '');
      var state = l.status === 'ready' ? money(l.line_total, o.currency) : label('problem_' + l.status, l.status);
      list.appendChild(el('li', null, what + ' × ' + (l.quantity || l.quantity_asked) + ' — ' + state));
    });
    box.appendChild(list);
    if (o.totals) {
      box.appendChild(el('div', 'price', label('checkout', 'To checkout') + ': ' + money(o.totals.auto_total, o.currency)));
    }
    if (o.order_url) {
      box.appendChild(button('buy', label('checkout', 'To checkout'), o.order_url));
    }
    return box;
  }

  function draw() {
    while (root.firstChild) {
      root.removeChild(root.firstChild);
    }
    if (!data) {
      return;
    }
    if (data.products && data.products.length) {
      var row = el('div', 'row');
      data.products.forEach(function (p) { row.appendChild(card(p)); });
      root.appendChild(row);
    } else if (data.lines) {
      root.appendChild(checked(data));
    } else if (data.url !== undefined || data.links) {
      root.appendChild(order(data));
    }
    if (meta.locale) {
      document.documentElement.lang = meta.locale;
      root.dir = meta.locale === 'he' ? 'rtl' : 'ltr';
    }
  }

  function take(output, extra) {
    if (output && typeof output === 'object') {
      data = output;
    }
    if (extra && typeof extra === 'object') {
      meta = extra;
    }
    draw();
  }

  // ChatGPT: the answer is on window.openai, and changes arrive as an event.
  function fromHost() {
    if (window.openai) {
      if (window.openai.theme) {
        document.documentElement.setAttribute('data-theme', window.openai.theme);
      }
      take(window.openai.toolOutput, window.openai.toolResponseMetadata);
    }
  }
  window.addEventListener('openai:set_globals', fromHost);
  fromHost();

  // MCP Apps: the answer arrives as a message from the host.
  window.addEventListener('message', function (event) {
    var m = event.data;
    if (m && m.jsonrpc === '2.0' && m.method === 'ui/notifications/tool-result' && m.params) {
      take(m.params.structuredContent, m.params._meta);
    }
  });
})();
</script>
</body>
</html>
