; Production PHP settings for the API image.
memory_limit = 512M
expose_php = Off
; an error is logged, never printed into a page or an answer (1.11)
display_errors = Off
display_startup_errors = Off
log_errors = On
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 20M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Octane keeps code in memory, and the image never changes after build.
opcache.validate_timestamps = 0
