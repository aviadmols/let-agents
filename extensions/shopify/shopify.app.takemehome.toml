# The custom-distribution app for take-me-home-collection, until the public app is approved (runbook, section 6).
# Pushed with `npx shopify app deploy --config takemehome --allow-updates`; never touches the public app (shopify.app.toml).
# The app itself (install, billing, webhooks) is served by apps/api, module Shopify.

# The app's Client ID from the Partner Dashboard (Apps > Let Agents > Client credentials).
# It is public, but each environment has its own app, so it is filled in by `shopify app config link`.
client_id = "3d352a99bbd40cca511e7ec956ad1c39"
name = "Lets search - Take Me Home"
handle = "lets-search-take-me-home"
application_url = "https://agents.lets.co.il/shopify/app"
# The shop's panel opens inside the Shopify admin, in its frame (App Bridge, session token exchange).
embedded = true

[build]
# The URLs above are production's; `shopify app dev` must not rewrite them.
automatically_update_urls_on_dev = false

[access_scopes]
# Shopify installs the app and grants these scopes; opening it then sends the store through
# our OAuth callback (granted already, so it passes straight through) for an offline token.
# Catalog and content for the index and the assistant's answers.
# The web pixel (write_pixels, read_customer_events) reports purchases that came through the search.
# write_app_proxy: Shopify requires it of an app with an app proxy (the wishlist, below) since 11.2026.
scopes = "read_products,read_content,write_content,read_online_store_pages,read_legal_policies,write_pixels,read_customer_events,write_app_proxy"

[auth]
redirect_urls = [ "https://agents.lets.co.il/shopify/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://agents.lets.co.il/api/v1/shopify/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://agents.lets.co.il/api/v1/shopify/webhooks"

  # Required of every public app: requests to see or erase a shopper's data, and the store's data after uninstall.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://agents.lets.co.il/api/v1/shopify/webhooks"

# The wishlist of a signed-in customer: the store calls /apps/letagents/wishlist on its own address,
# and Shopify forwards it here signed, with the customer it vouches for (logged_in_customer_id).
[app_proxy]
url = "https://agents.lets.co.il/api/v1/shortlist/proxy"
subpath = "letagents"
prefix = "apps"

[pos]
embedded = false
